services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-email}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-email}
      POSTGRES_DB: ${POSTGRES_DB:-email_scheduler}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U email -d email_scheduler"]
      interval: 2s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      PORT: "4000"
      NODE_ENV: production
      DATABASE_URL: postgres://email:email@postgres:5432/email_scheduler?sslmode=disable
      REDIS_URL: redis://redis:6379
    ports:
      - "${API_PORT:-4000}:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # No HTTP listener -> no healthcheck; liveness = restart policy + logs.
  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://email:email@postgres:5432/email_scheduler?sslmode=disable
      REDIS_URL: redis://redis:6379
      SMTP_HOST: smtp.ethereal.email
      SMTP_PORT: "587"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
